<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  VIRTUAL EGG BOBO — Anniversary Website                     ║
  ║                                                              ║
  ║  HOW TO RUN THIS FILE:                                       ║
  ║  Just double-click "index.html" in your folder and it will  ║
  ║  open in your browser. No extra software needed!            ║
  ║                                                              ║
  ║  HOW TO EDIT:                                               ║
  ║  - Open this file in any text editor (Notepad, VS Code…)    ║
  ║  - Save after changes, then refresh the browser tab         ║
  ║                                                              ║
  ║  FOLDER STRUCTURE (everything must stay together):          ║
  ║  project-folder/                                            ║
  ║  ├── index.html          ← this file                        ║
  ║  ├── images/             ← all egg pictures                 ║
  ║  ├── audio/              ← audio clips + manifest.json      ║
  ║  └── photos/             ← memory photos + manifest.json    ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page look good on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The tab title shown in the browser -->
    <title>Virtual Egg Bobo</title>

    <!-- ── FONTS ──────────────────────────────────────────────────
         We load two fonts from Google Fonts (free, hosted online).
         Lato  = the main body font used almost everywhere.
         Pacifico = the decorative/cursive font (currently loaded
                    but available if you want to use it).
    ─────────────────────────────────────────────────────────────-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <!-- ── MAP LIBRARY (Leaflet) ─────────────────────────────────
         Leaflet is a free JavaScript library that draws the
         interactive map in the "Sweet Memories" section.
         We load its CSS (styling) and JS (logic) from a CDN
         (a public server), so no download is needed.
    ─────────────────────────────────────────────────────────────-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
        /* ══════════════════════════════════════════════════════
           CSS — This section controls how everything LOOKS.
           Think of it as the "styling" rulebook.
           Format:  selector { property: value; }
           Example: h1 { color: red; }  ← makes all h1 pink
           ══════════════════════════════════════════════════════ */

        /* ── TOP NAVIGATION BAR ─────────────────────────────── */
        .navbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;          /* wraps onto next line on small screens */
            gap: 8px;
            background: rgba(255,255,255,0.85);
            padding: 10px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(233,30,99,0.10);
        }
        .navbar a {
            text-decoration: none;    /* removes the underline from links */
            color: #e91e63;
            font-weight: 700;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s; /* smooth color change on hover */
        }
        /* When you hover over a nav link OR it's the current page, fill it pink */
        .navbar a:hover,
        .navbar a.active {
            background: #e91e63;
            color: white;
        }

        /* ── PAGE BACKGROUND ────────────────────────────────── */
        body {
            font-family: 'Lato', sans-serif;
            background-color: #ffe6f0;  /* fallback color if the image doesn't load */
            text-align: center;
            padding: 20px;
            margin: 0;
            color: #333;
            background-image: url('images/flowers.png'); /* flower wallpaper */
            background-size: cover;
            background-attachment: fixed; /* wallpaper stays still when you scroll */
        }

        /* ── HEADINGS & PARAGRAPHS ──────────────────────────── */
        h1 { color: #e91e63; font-size: 28px; margin-bottom: 10px; }
        p  { font-size: 18px; margin: 10px 0; }

        /* ── EGG AVATAR IMAGE ───────────────────────────────── */
        .avatar-container { margin: 20px auto; }
        #avatar {
            max-height: 100vh; /* never taller than the screen */
            width: auto;       /* keeps the correct proportions */
            margin: 20px auto;
            transition: transform 0.2s; /* smooth grow effect on hover */
        }
        /* Makes the egg grow a little when you hover over it */
        #avatar:hover { transform: scale(1.1); }

        /* ── AUDIO BUTTONS ──────────────────────────────────── */
        .button-container {
            display: flex;
            flex-wrap: wrap;      /* buttons wrap to new lines on small screens */
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff69b4;  /* ← CHANGE THIS to change button color */
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        button:hover { background-color: #d81b60; } /* darker pink on hover */

        /* ── RESPONSIVE: adjustments for small/phone screens ── */
        @media (max-width: 600px) {
            h1     { font-size: 24px; }
            p      { font-size: 16px; }
            #avatar { width: 120px; }
            button { font-size: 14px; padding: 8px 16px; }
        }

        /* ── DAYS COUNTER BOXES ─────────────────────────────── */
        .counter-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .counter {
            background: rgba(255,255,255,0.8);
            padding: 12px 18px;
            border-radius: 12px;
            min-width: 120px;
        }
        .counter h2 { margin: 0; font-size: 16px; color: #e91e63; }
        .counter p  { font-size: 24px; font-weight: bold; margin: 4px 0 0; }

        /* ── TO-DO CHECKLIST BOX ────────────────────────────── */
        .todo-container {
            text-align: left;
            max-width: 320px;
            margin: 30px auto;
            background: rgba(255,255,255,0.8);
            padding: 16px;
            border-radius: 12px;
        }
        .todo-container h2           { font-size: 18px; color: #e91e63; margin-bottom: 8px; }
        .todo-container ul           { list-style: none; padding: 0; }
        .todo-container li           { margin-bottom: 8px; }
        .todo-container label        { cursor: pointer; font-size: 16px; }
        .todo-container input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2); /* makes the checkbox a little bigger */
        }

        /* ── SWEET MEMORIES PHOTO + MAP BOX ─────────────────── */
        .memory-container {
            margin: 30px auto;
            max-width: 360px;
            background: rgba(255,255,255,0.85);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .memory-container h2         { color: #e91e63; margin-bottom: 12px; }
        .memory-container img        { width: 100%; height: auto; border-radius: 8px; margin-bottom: 8px; }
        .memory-container p          { margin: 4px 0; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <!-- ══════════════════════════════════════════════════════════
         HTML — This section is the actual visible CONTENT.
         Tags look like:  <tagname>content here</tagname>
         Anything between <!-- and -​-​> is a comment (not shown).
         ══════════════════════════════════════════════════════════ -->

    <!-- ── NAVIGATION BAR AT THE TOP ───────────────────────────
         Each <a href="..."> is a link to another page.
         The "active" class highlights the current page tab.
         To add a new page tab: copy one <a> line and change
         the href and emoji/label text.
    ──────────────────────────────────────────────────────────── -->
    <nav class="navbar">
        <a href="index.html" class="active">🥚 Egg Bobo</a>
        <a href="sleep.html">😴 Sleep</a>
        <a href="poop.html">💩 Poop</a>
        <a href="contacts.html">👁️ Con</a>
    </nav>

    <!-- ── PAGE TITLE & SUBTITLE ────────────────────────────────
         Change the text between <h1> tags to update the big title.
         Change the <p> text to update the smaller subtitle lines.
    ──────────────────────────────────────────────────────────── -->
    <h1>Virtual Egg Bobo</h1>
    <p>Talk to virtual egg bobo by tapping his head or the buttons below. HEHEHE</p>

    <!-- ── EGG AVATAR ───────────────────────────────────────────
         The egg image. Clicking it plays a random "general" clip.
         src="images/Default_egg.png" = which image to show by default.
         onclick="playGeneralMessage()" = what happens when tapped.
    ──────────────────────────────────────────────────────────── -->
    <div class="avatar-container">
        <img id="avatar" src="images/Default_egg.png" alt="Cartoon Avatar" onclick="playGeneralMessage()">
    </div>

    <!-- ── AUDIO BUTTONS ────────────────────────────────────────
         Each button calls playMessage('keyword') when clicked.
         The keyword must match a key inside audio/manifest.json.
         To add a new button:
           1. Add a line here:  <button onclick="playMessage('newkey')">Label</button>
           2. Add the matching audio files in audio/manifest.json
           3. Add the matching image in avatarImages (in the script below)
    ──────────────────────────────────────────────────────────── -->
    <div class="button-container">
        <button onclick="playMessage('benaughty')">Be Naughty</button>
        <button onclick="playMessage('callmyname')">Call My Name</button>
        <button onclick="playMessage('egglanguage')">Egg Language</button>
        <button onclick="playMessage('goodmorning')">Good Morning</button>
        <button onclick="playMessage('goodnight')">Good Night</button>
        <button onclick="playMessage('praiseme')">Praise Me</button>
        <button onclick="playMessage('singforme')">Sing For Me</button>
        <button onclick="playMessage('stretchwithme')">Stretch With Me</button>
        <button onclick="playMessage('gayauintern')">Gayau Intern</button>
    </div>

    <!-- ── DAYS TOGETHER & DAYS UNTIL WEDDING COUNTERS ──────────
         The numbers are filled in automatically by JavaScript.
         To change the start date or wedding date, see the script
         section below — look for "togetherStart" and "weddingDay".
    ──────────────────────────────────────────────────────────── -->
    <div id="counters" class="counter-container">
        <div class="counter">
            <h2>Days Together</h2>
            <p id="days-together">—</p>
        </div>
        <div class="counter">
            <h2>Days Until Wedding</h2>
            <p id="days-until-wedding">—</p>
        </div>
    </div>

    <!-- ── DAILY TO-DO CHECKLIST ────────────────────────────────
         Checkboxes are saved in the browser so they remember if
         you've ticked them. They automatically reset each new day.
         To add a new item:
           1. Copy one <li> line and give the input a new unique id
           2. Add that same id to the list in the script section
              (look for the big array of 'todo-...' ids)
    ──────────────────────────────────────────────────────────── -->
    <div id="todo-lists" class="todo-container">
        <h2>Daily To-Dos</h2>
        <ul>
            <li><label><input type="checkbox" id="todo-water"> Did you drink 2L of water?</label></li>
            <li><label><input type="checkbox" id="todo-poop"> Did you poop?</label></li>
            <li><label><input type="checkbox" id="todo-miss"> Did you miss me?</label></li>
        </ul>

        <h2>Before Bed</h2>
        <ul>
            <li><label><input type="checkbox" id="todo-contacts"> Remove con</label></li>
            <li><label><input type="checkbox" id="todo-makeup"> Remove eye makeup</label></li>
            <li><label><input type="checkbox" id="todo-blanket"> Kum pei</label></li>
            <li><label><input type="checkbox" id="todo-lights"> Turn off the lights</label></li>
            <li><label><input type="checkbox" id="todo-dryhair"> Dry hair hair</label></li>
            <li><label><input type="checkbox" id="todo-wetbobo"> I am a wet bobo 🐷</label></li>
        </ul>
    </div>

    <!-- ── SWEET MEMORIES SECTION ───────────────────────────────
         Every time the page loads, it picks a random photo from
         photos/manifest.json, shows it with the date and map.
         The map marker and place name come from the GPS coordinates
         stored alongside each photo in the manifest file.
    ──────────────────────────────────────────────────────────── -->
    <div id="sweet-memories" class="memory-container">
        <h2>Sweet Memories with Hubbie</h2>
        <!-- These are filled in automatically by JavaScript below -->
        <img id="memory-photo" src="" alt="A sweet memory" />
        <p id="memory-date"></p>
        <p id="memory-location"></p>
        <div id="memory-map" style="width:100%;height:200px;margin-top:8px;"></div>
    </div>

    <!-- Hidden audio player — you can't see it but JavaScript uses it to play sounds -->
    <audio id="player"></audio>


    <!-- ══════════════════════════════════════════════════════════
         JAVASCRIPT — This is the "brain" of the page.
         It runs automatically after the page loads and handles:
           • Playing audio when buttons are clicked
           • Updating the day counters
           • Saving/loading checkbox state
           • Loading a random memory photo + map
         Everything between <script> and </script> is JS code.
         ══════════════════════════════════════════════════════════ -->
    <script>

    // ── CONSTANTS ─────────────────────────────────────────────────
    // These are fixed values used throughout the script.

    const MS_PER_DAY = 1000 * 60 * 60 * 24; // milliseconds in one day

    // ↓ CHANGE THESE DATES if needed (format: YYYY-MM-DD)
    const togetherStart = new Date("2024-06-22T00:00:00+08:00"); // relationship start
    const weddingDay    = new Date("2030-06-22T00:00:00+08:00"); // wedding target date

    // ── CHECKLIST AUTO-RESET ───────────────────────────────────────
    // This runs immediately when the page loads.
    // It checks today's date; if it's a new day, it clears all
    // checkboxes so they start fresh. Works like a daily planner.
    (function resetChecklistDaily() {
        const today = new Date().toISOString().split('T')[0]; // e.g. "2026-06-03"
        if (localStorage.getItem('checklistDate') !== today) {
            // ↓ ADD any new checkbox id here too if you create more checkboxes
            ['todo-water','todo-poop','todo-miss',
             'todo-contacts','todo-makeup','todo-blanket',
             'todo-lights','todo-dryhair','todo-wetbobo']
                .forEach(id => localStorage.removeItem(id));
            localStorage.setItem('checklistDate', today);
        }
    })();

    // ── AUDIO FILES ────────────────────────────────────────────────
    // audioFiles is loaded from audio/manifest.json.
    // That file is a dictionary like:
    //   { "goodmorning": ["audio/gm1.mp3", "audio/gm2.mp3"], ... }
    // Each button keyword maps to a list of audio file paths.
    let audioFiles = {};
    fetch('audio/manifest.json')
        .then(r => r.json())
        .then(d => { audioFiles = d; })
        .catch(e => console.error('Could not load audio manifest:', e));

    // ── AVATAR IMAGES ──────────────────────────────────────────────
    // Maps each button keyword to the egg image shown during playback.
    // To add a new button: add a new line here with your keyword and image path.
    // Example:  mykey: 'images/my_new_egg.png'
    const avatarImages = {
        benaughty:    'images/naughty_egg.png',
        callmyname:   'images/Say_name_egg.png',
        egglanguage:  'images/egg_language.png',
        general:      'images/Default_egg.png',      // used when tapping the egg itself
        goodmorning:  'images/Good_morning_egg.png',
        goodnight:    'images/Sleeping_egg.png',
        praiseme:     'images/Praise_me_egg.png',
        singforme:    'images/Singing_egg.png',
        stretchwithme:'images/Default_egg.png',      // no special image yet, uses default
        gayauintern:  'images/G bobo.png'
    };

    // ── AUDIO PLAYBACK ─────────────────────────────────────────────
    // Called when the egg avatar itself is tapped.
    function playGeneralMessage() {
        playMessage('general');
    }

    // Called by every button. "type" is the keyword like 'goodmorning'.
    function playMessage(type) {
        const list = audioFiles[type] || [];
        if (!list.length) {
            console.warn('No audio clips found for: ' + type);
            return; // stop here if no audio is set up yet
        }

        // Pick a random clip from the list
        const entry = list[Math.floor(Math.random() * list.length)];

        const player = document.getElementById('player');
        const avatar = document.getElementById('avatar');

        // entry can be a plain string path, OR an object {audio: "...", image: "..."}
        if (typeof entry === 'string') {
            player.src = entry;
            avatar.src = avatarImages[type] || avatarImages.general;
        } else {
            player.src  = entry.audio;
            avatar.src  = entry.image; // lets individual clips have their own image
        }

        player.play().catch(e => console.error('Playback failed:', e));
    }

    // ── DAY COUNTERS ───────────────────────────────────────────────
    // Calculates how many days you've been together and until the wedding,
    // then puts those numbers into the two counter boxes on the page.
    function updateCounters() {
        const now = new Date();
        // +1 so Day 1 shows on the very first day (not Day 0)
        document.getElementById('days-together').textContent =
            Math.floor((now - togetherStart) / MS_PER_DAY) + 1;
        document.getElementById('days-until-wedding').textContent =
            Math.ceil((weddingDay - now) / MS_PER_DAY);
    }

    // ── CHECKBOX PERSISTENCE ───────────────────────────────────────
    // For each checkbox id, this loads the saved state from the
    // browser's localStorage and sets up a listener so any future
    // ticks/unticks are saved immediately.
    function syncCheckbox(id) {
        const cb = document.getElementById(id);
        cb.checked = localStorage.getItem(id) === 'true'; // restore saved state
        cb.addEventListener('change', () => {
            localStorage.setItem(id, cb.checked); // save on every tick/untick
        });
    }

    // ── ON PAGE LOAD ───────────────────────────────────────────────
    // Everything here runs once the page has fully loaded.
    window.addEventListener('load', () => {
        updateCounters(); // show the day numbers right away
        setInterval(updateCounters, 1000 * 60 * 60); // refresh counters every hour

        // ↓ ADD any new checkbox id here too when you create more checkboxes
        ['todo-water','todo-poop','todo-miss',
         'todo-contacts','todo-makeup','todo-blanket',
         'todo-lights','todo-dryhair','todo-wetbobo']
            .forEach(syncCheckbox);
    });

    // ── SWEET MEMORIES ─────────────────────────────────────────────
    // Loads photos/manifest.json which is a list of photo entries like:
    //   [{ "url": "photos/abc.jpg", "date": "2025-02-14", "location": "22.3,114.1" }, ...]
    // Picks a random one, shows the photo, puts a pin on the map,
    // and converts the GPS coordinates into a readable place name.
    fetch('photos/manifest.json')
        .then(r => r.json())
        .then(photos => {
            const idx = Math.floor(Math.random() * photos.length);
            const { url, date, location: locStr } = photos[idx];

            // Show the photo
            document.getElementById('memory-photo').src = url;

            // Show the date/time
            const takenDate = new Date(date);
            if (!isNaN(takenDate.getTime()) && date.includes('T')) {
                // If the date has a time part, show HH:MM
                const hh = String(takenDate.getHours()).padStart(2, '0');
                const mm = String(takenDate.getMinutes()).padStart(2, '0');
                document.getElementById('memory-date').textContent = `Taken at ${hh}:${mm}`;
            } else {
                document.getElementById('memory-date').textContent = `Taken on ${date}`;
            }

            // Parse GPS coordinates (stored as "lat,lon" e.g. "22.3,114.1")
            const [lat, lon] = locStr.split(',').map(s => parseFloat(s));

            // Draw the Leaflet map and drop a pin
            const map = L.map('memory-map').setView([lat, lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            L.marker([lat, lon]).addTo(map);

            // Reverse-geocode: turn GPS numbers into "City, Country" text
            // Uses OpenStreetMap's free Nominatim service
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`)
                .then(r => r.json())
                .then(data => {
                    const addr = data.address || {};
                    const city    = addr.city || addr.town || addr.village || addr.county || addr.state;
                    const country = addr.country;
                    let placeText = 'Unknown location';
                    if (city && country)  placeText = `${city}, ${country}`;
                    else if (city)        placeText = city;
                    else if (country)     placeText = country;
                    document.getElementById('memory-location').textContent = placeText;
                })
                .catch(() => {
                    // If the lookup fails, just show the raw coordinates
                    document.getElementById('memory-location').textContent = locStr;
                });
        })
        .catch(e => console.error('Could not load memories:', e));

    </script>
</body>
</html>
