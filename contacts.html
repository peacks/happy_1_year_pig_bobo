<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Con Lens Tracker 👁️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Lato',sans-serif;background-color:#ffe6f0;background-image:url('images/flowers.png');background-size:cover;background-attachment:fixed;min-height:100vh;padding:20px;color:#333;text-align:center;}
        .navbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,0.85);padding:10px 16px;border-radius:16px;margin-bottom:24px;box-shadow:0 2px 8px rgba(233,30,99,0.10);}
        .navbar a{text-decoration:none;color:#e91e63;font-weight:700;font-size:14px;padding:7px 14px;border-radius:20px;transition:background 0.2s,color 0.2s;}
        .navbar a:hover,.navbar a.active{background:#e91e63;color:white;}
        h1{color:#e91e63;font-size:26px;margin-bottom:6px;}
        .subtitle{font-size:15px;color:#888;margin-bottom:20px;}
        .syncing{font-size:12px;color:#aaa;margin-bottom:8px;min-height:18px;}
        .alert-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:12px 16px;max-width:360px;margin:0 auto 16px;font-size:14px;color:#856404;display:none;}
        .alert-banner.show{display:block;}
        .form-card{background:rgba(255,255,255,0.90);border-radius:16px;padding:20px;max-width:360px;margin:0 auto 28px;box-shadow:0 2px 12px rgba(233,30,99,0.08);text-align:left;}
        .form-card h2{color:#e91e63;font-size:16px;margin-bottom:14px;text-align:center;}
        .form-row{margin-bottom:12px;}
        .form-row label{font-size:12px;color:#888;display:block;margin-bottom:4px;}
        .form-row input{width:100%;padding:8px 12px;border:1px solid #f48fb1;border-radius:10px;font-size:14px;}
        .toggle-group{display:flex;gap:6px;flex-wrap:wrap;}
        .toggle-btn{padding:7px 14px;border:1px solid #f48fb1;border-radius:20px;background:white;color:#e91e63;font-size:13px;cursor:pointer;transition:background 0.15s,color 0.15s;}
        .toggle-btn.active{background:#e91e63;color:white;border-color:#e91e63;}
        .submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#ff69b4,#e91e63);color:white;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;box-shadow:0 4px 12px rgba(233,30,99,0.25);}
        .submit-btn:hover{opacity:0.9;}
        .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
        .status-row{display:flex;gap:12px;justify-content:center;max-width:360px;margin:0 auto 24px;}
        .status-card{flex:1;background:rgba(255,255,255,0.88);border-radius:14px;padding:14px 10px;box-shadow:0 2px 8px rgba(233,30,99,0.08);}
        .status-card h3{font-size:13px;color:#888;margin-bottom:6px;}
        .status-card .days-val{font-size:22px;font-weight:900;color:#e91e63;}
        .status-card .days-label{font-size:11px;color:#aaa;}
        .status-card.warn .days-val{color:#ff6f00;}
        .status-card.danger .days-val{color:#e53935;}
        .calendar-section{max-width:380px;margin:0 auto;background:rgba(255,255,255,0.88);border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(233,30,99,0.08);}
        .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .cal-header h2{font-size:17px;color:#e91e63;}
        .cal-nav{background:none;border:none;font-size:20px;color:#e91e63;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background 0.2s;}
        .cal-nav:hover{background:rgba(233,30,99,0.10);}
        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
        .cal-day-label{font-size:11px;font-weight:700;color:#bbb;text-align:center;padding-bottom:4px;}
        .cal-cell{min-height:52px;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:13px;cursor:default;position:relative;}
        .cal-cell.has-data{background:rgba(233,30,99,0.08);cursor:pointer;}
        .cal-cell.has-data:hover{background:rgba(233,30,99,0.18);}
        .cal-cell.today .cal-date-num{background:#e91e63;color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
        .cal-cell.overdue{background:rgba(255,100,0,0.10);}
        .cal-cell.overdue .cal-date-num{color:#e65100;}
        .cal-date-num{font-weight:700;font-size:13px;color:#444;margin-bottom:2px;}
        .cal-eye{font-size:10px;color:#e91e63;font-weight:700;line-height:1.3;}
        .cal-warn{font-size:14px;position:absolute;top:2px;right:4px;}
        .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;align-items:center;justify-content:center;}
        .popup-overlay.show{display:flex;}
        .popup{background:white;border-radius:18px;padding:24px;max-width:340px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.18);text-align:left;max-height:85vh;overflow-y:auto;}
        .popup h3{color:#e91e63;margin-bottom:12px;font-size:17px;}
        .entry-row{padding:8px 0;border-bottom:1px solid #f5f5f5;}
        .entry-row:last-child{border-bottom:none;}
        .entry-tag{display:inline-block;background:#fff0f5;color:#e91e63;border-radius:6px;padding:1px 7px;font-size:12px;margin:1px;}
        .entry-actions{display:flex;gap:6px;margin-top:6px;}
        .btn-edit{background:#fff0f5;border:1px solid #f48fb1;color:#e91e63;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
        .btn-edit:hover{background:#fce4ec;}
        .btn-del{background:#fff0f0;border:1px solid #ffcdd2;color:#e53935;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
        .btn-del:hover{background:#ffebee;}
        .edit-form{background:#fff8fa;border-radius:10px;padding:12px;margin-top:8px;display:none;}
        .edit-form.show{display:block;}
        .edit-form label{font-size:12px;color:#888;display:block;margin-bottom:2px;margin-top:8px;}
        .edit-form input{width:100%;padding:7px 10px;border:1px solid #f48fb1;border-radius:8px;font-size:14px;}
        .ef-toggle-group{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
        .ef-toggle-btn{padding:5px 10px;border:1px solid #f48fb1;border-radius:16px;background:white;color:#e91e63;font-size:12px;cursor:pointer;}
        .ef-toggle-btn.active{background:#e91e63;color:white;}
        .btn-save{margin-top:10px;width:100%;padding:9px;background:#e91e63;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
        .popup-close{display:block;margin-top:16px;width:100%;padding:10px;background:#e91e63;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
        .popup-close:hover{background:#c2185b;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#e91e63;color:white;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:700;opacity:0;transition:opacity 0.3s,transform 0.3s;z-index:999;pointer-events:none;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">🥚 Egg Bobo</a>
        <a href="sleep.html">😴 Sleep</a>
        <a href="poop.html">💩 Poop</a>
        <a href="contacts.html" class="active">👁️ Con</a>
    </nav>
    <h1>👁️ Con Lens Tracker</h1>
    <p class="subtitle">Track when you change your contact lenses! 30-day reminder included.</p>
    <div class="syncing" id="sync-status">Loading data...</div>

    <div class="alert-banner" id="alert-banner"></div>

    <div class="status-row">
        <div class="status-card" id="left-status-card">
            <h3>👁 Left Eye</h3>
            <div class="days-val" id="left-days">—</div>
            <div class="days-label">days since change</div>
        </div>
        <div class="status-card" id="right-status-card">
            <h3>👁 Right Eye</h3>
            <div class="days-val" id="right-days">—</div>
            <div class="days-label">days since change</div>
        </div>
    </div>

    <div class="form-card">
        <h2>+ Log a lens change</h2>
        <div class="form-row">
            <label>Date</label>
            <input type="date" id="con-date">
        </div>
        <div class="form-row">
            <label>Which eye?</label>
            <div class="toggle-group" id="eye-group">
                <button class="toggle-btn" data-val="left"  onclick="toggleBtn('eye-group',this)">👁 Left</button>
                <button class="toggle-btn" data-val="right" onclick="toggleBtn('eye-group',this)">👁 Right</button>
                <button class="toggle-btn" data-val="both"  onclick="toggleBtn('eye-group',this)">👀 Both</button>
            </div>
        </div>
        <button class="submit-btn" id="submit-btn" onclick="logCon()" disabled>Log it 👁️</button>
    </div>

    <div class="calendar-section">
        <div class="cal-header">
            <button class="cal-nav" onclick="changeMonth(-1)">◀</button>
            <h2 id="cal-title">Month Year</h2>
            <button class="cal-nav" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="popup-overlay" id="popup-overlay">
        <div class="popup">
            <h3 id="popup-title"></h3>
            <div id="popup-entries"></div>
            <button class="popup-close" onclick="closePopup()">Close</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
    // ─── Firebase Realtime Database ──────────────────────────────
    // SETUP (one-time, ~5 min):
    // 1. Go to https://console.firebase.google.com → create a free project
    // 2. Click "Realtime Database" → Create Database → Start in TEST MODE
    // 3. Copy your DB URL (looks like: https://YOUR-PROJECT-default-rtdb.firebaseio.com)
    // 4. Replace YOUR-PROJECT in the DB_URL line below
    // 5. In Database → Rules tab, set:
    //    { "rules": { ".read": true, ".write": true } }  then Publish
    const DB_URL = 'https://YOUR-PROJECT-default-rtdb.firebaseio.com/pigbobo.json';
    // ─────────────────────────────────────────────────────────────

    let allData  = { sleep:[], poop:[], contacts:[] };
    let currentYear, currentMonth;
    let editingId = null;
    let isSaving  = false;

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !isSaving) fetchData();
    });

    // Guarantees we always work with clean arrays — no nesting possible
    function clean(obj) {
        if (!obj || typeof obj !== 'object') return { sleep:[], poop:[], contacts:[] };
        return {
            sleep:    Array.isArray(obj.sleep)    ? obj.sleep    : [],
            poop:     Array.isArray(obj.poop)      ? obj.poop     : [],
            contacts: Array.isArray(obj.contacts)  ? obj.contacts : []
        };
    }

    async function fetchData() {
        setStatus('Syncing...');
        try {
            const res  = await fetch(DB_URL);
            const data = await res.json();
            allData    = clean(data);
            setStatus('');
        } catch(e) {
            setStatus('⚠️ Could not load data');
            console.error('fetchData error:', e);
        }
        document.getElementById('submit-btn').disabled = false;
        updateStatusCards();
        renderCalendar();
    }

    async function saveData(newEntry, type) {
        isSaving = true;
        setStatus('Saving...');
        try {
            // Step 1: Read latest from Firebase
            const res   = await fetch(DB_URL);
            const data  = await res.json();
            const fresh = clean(data);

            // Step 2: Apply change
            if (newEntry && type) {
                if (newEntry._delete) {
                    fresh[type] = fresh[type].filter(e => e.id !== newEntry.id);
                } else if (newEntry._edit) {
                    const idx = fresh[type].findIndex(e => e.id === newEntry.id);
                    if (idx !== -1) fresh[type][idx] = newEntry._data;
                    else fresh[type].push(newEntry._data);
                } else {
                    fresh[type].push(newEntry);
                }
            }

            // Step 3: Update local copy
            allData = fresh;

            // Step 4: Write to Firebase — PUT stores exactly what you send, reads back exactly that
            await fetch(DB_URL, {
                method:  'PUT',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(fresh)
            });

            setStatus('✅ Saved!');
            setTimeout(() => setStatus(''), 2000);
        } catch(e) {
            setStatus('⚠️ Save failed');
            console.error('saveData error:', e);
        }
        isSaving = false;
        updateStatusCards();
        renderCalendar();
    }

        function setStatus(msg) { document.getElementById('sync-status').textContent = msg; }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
    function monthName(i) { return ['January','February','March','April','May','June','July','August','September','October','November','December'][i]; }
    function formatDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function daysBetween(dateKeyA, dateKeyB) {
        return Math.floor((new Date(dateKeyB) - new Date(dateKeyA)) / 86400000);
    }

    function toggleBtn(groupId, btn) {
        document.querySelectorAll(`#${groupId} .toggle-btn`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    function getToggle(groupId) {
        const a = document.querySelector(`#${groupId} .toggle-btn.active`);
        return a ? a.dataset.val : '';
    }

    window.addEventListener('load', () => {
        document.getElementById('con-date').value = formatDateKey(new Date());
    });

    function lastChangeDate(eye) {
        const relevant = allData.contacts
            .filter(e => e.eye === eye || e.eye === 'both')
            .sort((a,b) => a.dateKey < b.dateKey ? 1 : -1);
        return relevant.length ? relevant[0].dateKey : null;
    }

    function updateStatusCards() {
        const today = formatDateKey(new Date());
        ['left','right'].forEach(eye => {
            const last = lastChangeDate(eye);
            const card = document.getElementById(`${eye}-status-card`);
            const val  = document.getElementById(`${eye}-days`);
            if (!last) { val.textContent = '—'; card.className = 'status-card'; return; }
            const days = daysBetween(last, today);
            val.textContent = days;
            card.className  = 'status-card' + (days >= 30 ? ' danger' : days >= 25 ? ' warn' : '');
        });
        const alerts = [];
        ['left','right'].forEach(eye => {
            const last = lastChangeDate(eye);
            if (last) {
                const days = daysBetween(last, today);
                if (days >= 30) alerts.push(`⚠️ ${eye.charAt(0).toUpperCase()+eye.slice(1)} eye: ${days} days! Change your con NOW!`);
            }
        });
        const banner = document.getElementById('alert-banner');
        if (alerts.length) { banner.innerHTML = alerts.join('<br>'); banner.classList.add('show'); }
        else banner.classList.remove('show');
    }

    async function logCon() {
        const date = document.getElementById('con-date').value;
        const eye  = getToggle('eye-group');
        if (!date) { showToast('Please pick a date!'); return; }
        if (!eye)  { showToast('Please pick which eye!'); return; }
        const entry = { id: uid(), dateKey: date, eye };
        showToast(`Logged ${eye} eye change! 👁️`);
        await saveData(entry, 'contacts');
    }

    function changeMonth(d) {
        currentMonth += d;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    function renderCalendar() {
        const today = formatDateKey(new Date());
        const byDate = {};
        allData.contacts.forEach(e => {
            if (!byDate[e.dateKey]) byDate[e.dateKey] = [];
            byDate[e.dateKey].push(e);
        });
        const lastLeft  = lastChangeDate('left');
        const lastRight = lastChangeDate('right');
        document.getElementById('cal-title').textContent = `${monthName(currentMonth)} ${currentYear}`;
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';
        ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
            const l = document.createElement('div'); l.className = 'cal-day-label'; l.textContent = d; grid.appendChild(l);
        });
        const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) {
            const b = document.createElement('div'); b.className = 'cal-cell'; grid.appendChild(b);
        }
        for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const entries = byDate[dateKey] || [];
            let overdue = false;
            if (lastLeft  && daysBetween(lastLeft, dateKey)  === 30) overdue = true;
            if (lastRight && daysBetween(lastRight, dateKey) === 30) overdue = true;
            const cell = document.createElement('div');
            cell.className = 'cal-cell'
                + (entries.length ? ' has-data' : '')
                + (dateKey === today ? ' today' : '')
                + (overdue ? ' overdue' : '');
            const num = document.createElement('div'); num.className = 'cal-date-num'; num.textContent = day; cell.appendChild(num);
            if (overdue && !entries.length) {
                const w = document.createElement('div'); w.className = 'cal-warn'; w.textContent = '⏰'; cell.appendChild(w);
            }
            if (entries.length) {
                const eyes = [...new Set(entries.map(e => e.eye))];
                const eyeEl = document.createElement('div'); eyeEl.className = 'cal-eye';
                eyeEl.textContent = eyes.map(e => e === 'both' ? '👀' : e === 'left' ? 'L' : 'R').join(' ');
                cell.appendChild(eyeEl);
                cell.onclick = () => openPopup(dateKey, entries);
            }
            grid.appendChild(cell);
        }
    }

    function openPopup(dateKey, entries) {
        const parts = dateKey.split('-');
        document.getElementById('popup-title').textContent =
            `👁️ Con change on ${parseInt(parts[2])} ${monthName(parseInt(parts[1])-1)} ${parts[0]}`;
        renderPopupEntries(dateKey, entries);
        document.getElementById('popup-overlay').classList.add('show');
    }

    function renderPopupEntries(dateKey, entries) {
        const container = document.getElementById('popup-entries');
        container.innerHTML = '';
        entries.forEach(entry => {
            const eyeLabel = entry.eye === 'both' ? '👀 Both eyes' : entry.eye === 'left' ? '👁 Left eye' : '👁 Right eye';
            const row = document.createElement('div');
            row.className = 'entry-row';
            row.innerHTML = `
                <div><span class="entry-tag">${eyeLabel}</span></div>
                <div class="entry-actions">
                    <button class="btn-edit" onclick="showEditForm('${entry.id}')">✏️ Edit</button>
                    <button class="btn-del"  onclick="deleteEntry('${entry.id}')">🗑 Delete</button>
                </div>
                <div class="edit-form" id="edit-${entry.id}">
                    <label>Date</label>
                    <input type="date" id="ed-${entry.id}" value="${entry.dateKey}">
                    <label>Which eye?</label>
                    <div class="ef-toggle-group" id="ee-${entry.id}">
                        <button class="ef-toggle-btn${entry.eye==='left'?' active':''}"  data-val="left"  onclick="efToggle('ee-${entry.id}',this)">👁 Left</button>
                        <button class="ef-toggle-btn${entry.eye==='right'?' active':''}" data-val="right" onclick="efToggle('ee-${entry.id}',this)">👁 Right</button>
                        <button class="ef-toggle-btn${entry.eye==='both'?' active':''}"  data-val="both"  onclick="efToggle('ee-${entry.id}',this)">👀 Both</button>
                    </div>
                    <button class="btn-save" onclick="saveEdit('${entry.id}')">Save changes</button>
                </div>`;
            container.appendChild(row);
        });
    }

    function efToggle(groupId, btn) {
        document.querySelectorAll(`#${groupId} .ef-toggle-btn`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    function efGetToggle(groupId) {
        const a = document.querySelector(`#${groupId} .ef-toggle-btn.active`);
        return a ? a.dataset.val : '';
    }

    function showEditForm(id) {
        document.querySelectorAll('.edit-form.show').forEach(f => f.classList.remove('show'));
        if (editingId === id) { editingId = null; return; }
        document.getElementById(`edit-${id}`).classList.add('show');
        editingId = id;
    }

    async function saveEdit(id) {
        const entry = allData.contacts.find(e => e.id === id);
        if (!entry) return;
        const updated = Object.assign({}, entry, {
            dateKey: document.getElementById(`ed-${id}`).value || entry.dateKey,
            eye:     efGetToggle(`ee-${id}`) || entry.eye
        });
        editingId = null;
        closePopup();
        showToast('Entry updated! 👁️');
        await saveData({ _edit: true, id, _data: updated }, 'contacts');
    }

    async function deleteEntry(id) {
        closePopup();
        showToast('Entry deleted!');
        await saveData({ _delete: true, id }, 'contacts');
    }

    function closePopup() {
        document.getElementById('popup-overlay').classList.remove('show');
        editingId = null;
    }
    document.getElementById('popup-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('popup-overlay')) closePopup();
    });

    function showToast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg;
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }

    const now = new Date(); currentYear = now.getFullYear(); currentMonth = now.getMonth();
    fetchData();
    </script>
</body>
</html>
