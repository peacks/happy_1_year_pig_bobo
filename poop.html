<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poop Tracker 💩</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Lato',sans-serif;background-color:#ffe6f0;background-image:url('images/flowers.png');background-size:cover;background-attachment:fixed;min-height:100vh;padding:20px;color:#333;text-align:center;}
        .navbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,0.85);padding:10px 16px;border-radius:16px;margin-bottom:24px;box-shadow:0 2px 8px rgba(233,30,99,0.10);}
        .navbar a{text-decoration:none;color:#e91e63;font-weight:700;font-size:14px;padding:7px 14px;border-radius:20px;transition:background 0.2s,color 0.2s;}
        .navbar a:hover,.navbar a.active{background:#e91e63;color:white;}
        h1{color:#e91e63;font-size:26px;margin-bottom:6px;}
        .subtitle{font-size:15px;color:#888;margin-bottom:20px;}
        .form-card{background:rgba(255,255,255,0.90);border-radius:16px;padding:20px;max-width:380px;margin:0 auto 28px;box-shadow:0 2px 12px rgba(233,30,99,0.08);text-align:left;}
        .form-card h2{color:#e91e63;font-size:16px;margin-bottom:14px;text-align:center;}
        .form-row{margin-bottom:14px;}
        .form-row label{display:block;font-size:13px;font-weight:700;color:#888;margin-bottom:5px;}
        .form-row input[type="date"],.form-row input[type="time"],.form-row textarea{width:100%;padding:9px 12px;border:1.5px solid #f0c0d0;border-radius:10px;font-size:15px;font-family:'Lato',sans-serif;background:#fff8fb;color:#333;outline:none;transition:border-color 0.2s;}
        .form-row input:focus,.form-row textarea:focus{border-color:#e91e63;}
        .form-row textarea{resize:vertical;min-height:60px;}
        .pill-group{display:flex;flex-wrap:wrap;gap:8px;}
        .pill-group input[type="radio"]{display:none;}
        .pill-group label{display:inline-block;padding:7px 16px;border:1.5px solid #f0c0d0;border-radius:20px;font-size:14px;font-weight:700;color:#e91e63;cursor:pointer;transition:all 0.2s;background:#fff8fb;}
        .pill-group input[type="radio"]:checked+label{background:#e91e63;color:white;border-color:#e91e63;}
        .submit-btn{width:100%;padding:13px;background:#e91e63;color:white;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;transition:background 0.2s;}
        .submit-btn:hover{background:#c2185b;}
        .calendar-section{max-width:380px;margin:0 auto;background:rgba(255,255,255,0.88);border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(233,30,99,0.08);}
        .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .cal-header h2{font-size:17px;color:#e91e63;}
        .cal-nav{background:none;border:none;font-size:20px;color:#e91e63;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background 0.2s;}
        .cal-nav:hover{background:rgba(233,30,99,0.10);}
        .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
        .cal-day-label{font-size:11px;font-weight:700;color:#bbb;text-align:center;padding-bottom:4px;}
        .cal-cell{min-height:52px;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:13px;cursor:default;}
        .cal-cell.empty{background:transparent;}
        .cal-cell.has-data{background:rgba(233,30,99,0.08);cursor:pointer;}
        .cal-cell.has-data:hover{background:rgba(233,30,99,0.18);}
        .cal-cell.today .cal-date-num{background:#e91e63;color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
        .cal-date-num{font-weight:700;font-size:13px;color:#444;margin-bottom:2px;}
        .cal-poop-count{font-size:14px;line-height:1;}
        .cal-poop-label{font-size:9px;color:#e91e63;font-weight:700;}
        .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;align-items:center;justify-content:center;}
        .popup-overlay.show{display:flex;}
        .popup{background:white;border-radius:18px;padding:20px;max-width:340px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.18);text-align:left;max-height:80vh;overflow-y:auto;}
        .popup h3{color:#e91e63;margin-bottom:12px;font-size:17px;}
        .poop-entry{background:#fff8fb;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;position:relative;}
        .poop-entry .entry-time{font-weight:900;color:#e91e63;font-size:14px;}
        .poop-entry .entry-tags{margin:4px 0;display:flex;flex-wrap:wrap;gap:5px;}
        .tag{background:#ffe6f0;color:#e91e63;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700;}
        .poop-entry .entry-remarks{color:#777;font-size:12px;margin-top:4px;font-style:italic;}
        .entry-delete{position:absolute;top:8px;right:8px;background:none;border:none;font-size:15px;color:#ddd;cursor:pointer;}
        .entry-delete:hover{color:#e91e63;}
        .popup-close{display:block;margin-top:14px;width:100%;padding:10px;background:#e91e63;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
        .popup-close:hover{background:#c2185b;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#e91e63;color:white;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:700;opacity:0;transition:opacity 0.3s,transform 0.3s;z-index:999;pointer-events:none;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">🥚 Egg Bobo</a>
        <a href="sleep.html">😴 Sleep</a>
        <a href="poop.html" class="active">💩 Poop</a>
        <a href="contacts.html">👁️ Con</a>
    </nav>
    <h1>💩 Poop Tracker</h1>
    <p class="subtitle">Log every magical moment 🚽</p>
    <div class="form-card">
        <h2>Log a Poop</h2>
        <div class="form-row"><label>📅 Date</label><input type="date" id="poop-date"></div>
        <div class="form-row"><label>🕐 Time (approx)</label><input type="time" id="poop-time"></div>
        <div class="form-row">
            <label>📏 Size</label>
            <div class="pill-group">
                <input type="radio" name="poop-size" id="size-big" value="Big"><label for="size-big">🐘 Big</label>
                <input type="radio" name="poop-size" id="size-medium" value="Medium" checked><label for="size-medium">🐱 Medium</label>
                <input type="radio" name="poop-size" id="size-small" value="Small"><label for="size-small">🐭 Small</label>
            </div>
        </div>
        <div class="form-row">
            <label>💧 Consistency</label>
            <div class="pill-group">
                <input type="radio" name="poop-consistency" id="con-hard" value="Hard"><label for="con-hard">🪨 Hard</label>
                <input type="radio" name="poop-consistency" id="con-soft" value="Soft" checked><label for="con-soft">🍌 Soft</label>
                <input type="radio" name="poop-consistency" id="con-watery" value="Watery"><label for="con-watery">💦 Watery</label>
            </div>
        </div>
        <div class="form-row"><label>📝 Remarks (optional)</label><textarea id="poop-remarks" placeholder="How did it go? Any notes..."></textarea></div>
        <button class="submit-btn" onclick="logPoop()">💩 Log it!</button>
    </div>
    <div class="calendar-section">
        <div class="cal-header">
            <button class="cal-nav" onclick="changeMonth(-1)">◀</button>
            <h2 id="cal-title">Month Year</h2>
            <button class="cal-nav" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
        <div class="popup">
            <h3 id="popup-title">Poop on ...</h3>
            <div id="popup-entries"></div>
            <button class="popup-close" onclick="closePopup()">Close</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
    const STORAGE_KEY='poopEntries';
    function loadEntries(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return[];}}
    function saveEntries(e){localStorage.setItem(STORAGE_KEY,JSON.stringify(e));}
    function monthName(i){return['January','February','March','April','May','June','July','August','September','October','November','December'][i];}
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
    window.addEventListener('load',()=>{
        const now=new Date();
        document.getElementById('poop-date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        document.getElementById('poop-time').value=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    });
    function logPoop(){
        const date=document.getElementById('poop-date').value;
        const time=document.getElementById('poop-time').value;
        const size=document.querySelector('input[name="poop-size"]:checked')?.value||'Medium';
        const consist=document.querySelector('input[name="poop-consistency"]:checked')?.value||'Soft';
        const remarks=document.getElementById('poop-remarks').value.trim();
        if(!date||!time){showToast('Please fill in date and time!');return;}
        const entries=loadEntries();
        entries.push({id:Date.now(),dateKey:date,time,size,consistency:consist,remarks});
        saveEntries(entries);renderCalendar();
        document.getElementById('poop-remarks').value='';
        showToast('Logged! Good job 💩✨');
    }
    let currentYear,currentMonth;
    function changeMonth(d){currentMonth+=d;if(currentMonth>11){currentMonth=0;currentYear++;}if(currentMonth<0){currentMonth=11;currentYear--;}renderCalendar();}
    function renderCalendar(){
        const entries=loadEntries();
        const byDate={};
        entries.forEach(e=>{if(!byDate[e.dateKey])byDate[e.dateKey]=[];byDate[e.dateKey].push(e);});
        document.getElementById('cal-title').textContent=`${monthName(currentMonth)} ${currentYear}`;
        const grid=document.getElementById('cal-grid');grid.innerHTML='';
        ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{const l=document.createElement('div');l.className='cal-day-label';l.textContent=d;grid.appendChild(l);});
        const todayKey=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;})();
        const firstDay=new Date(currentYear,currentMonth,1).getDay();
        const daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();
        for(let i=0;i<firstDay;i++){const b=document.createElement('div');b.className='cal-cell empty';grid.appendChild(b);}
        for(let day=1;day<=daysInMonth;day++){
            const dateKey=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const dayEntries=byDate[dateKey]||[];
            const cell=document.createElement('div');
            cell.className='cal-cell'+(dayEntries.length?' has-data':'')+(dateKey===todayKey?' today':'');
            const num=document.createElement('div');num.className='cal-date-num';num.textContent=day;cell.appendChild(num);
            if(dayEntries.length){
                const emoji=document.createElement('div');emoji.className='cal-poop-count';
                emoji.textContent='💩'.repeat(Math.min(dayEntries.length,3));cell.appendChild(emoji);
                if(dayEntries.length>1){const lbl=document.createElement('div');lbl.className='cal-poop-label';lbl.textContent=`${dayEntries.length}x`;cell.appendChild(lbl);}
                cell.onclick=()=>openPopup(dateKey,dayEntries);
            }
            grid.appendChild(cell);
        }
    }
    function openPopup(dateKey,entries){
        const parts=dateKey.split('-');
        document.getElementById('popup-title').textContent=`💩 ${parseInt(parts[2])} ${monthName(parseInt(parts[1])-1)} ${parts[0]} (${entries.length}x)`;
        const container=document.getElementById('popup-entries');container.innerHTML='';
        entries.forEach(e=>{
            const div=document.createElement('div');div.className='poop-entry';
            div.innerHTML=`<div class="entry-time">🕐 ${e.time}</div><div class="entry-tags"><span class="tag">${e.size}</span><span class="tag">${e.consistency}</span></div>${e.remarks?`<div class="entry-remarks">"${e.remarks}"</div>`:''}`;
            const btn=document.createElement('button');btn.className='entry-delete';btn.textContent='🗑';
            btn.onclick=()=>deleteEntry(e.id);div.appendChild(btn);container.appendChild(div);
        });
        document.getElementById('popup-overlay').classList.add('show');
    }
    function closePopup(ev){if(!ev||ev.target===document.getElementById('popup-overlay')||!ev.target.closest('.popup')||ev.target.classList.contains('popup-close'))document.getElementById('popup-overlay').classList.remove('show');}
    function deleteEntry(id){
        let entries=loadEntries();entries=entries.filter(e=>e.id!==id);
        saveEntries(entries);renderCalendar();
        document.getElementById('popup-overlay').classList.remove('show');
        showToast('Entry deleted!');
    }
    const now=new Date();currentYear=now.getFullYear();currentMonth=now.getMonth();
    renderCalendar();
    </script>
</body>
</html>
